name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  checks:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deployment-smoke:
    name: Deployment smoke check
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push'

    env:
      FRONTEND_DEPLOY_URL: ${{ secrets.FRONTEND_DEPLOY_URL }}

    steps:
      - name: Check deployed frontend
        if: env.FRONTEND_DEPLOY_URL != ''
        run: |
          status="$(curl -sS -o /dev/null -w "%{http_code}" "$FRONTEND_DEPLOY_URL")"
          echo "Frontend returned HTTP $status"
          test "$status" -lt 500

      - name: Skip smoke check
        if: env.FRONTEND_DEPLOY_URL == ''
        run: echo "Set FRONTEND_DEPLOY_URL in GitHub repo secrets to enable deployed frontend checks."
